<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fake GPS</title>
  <style>
    :root {
      --color-bg: #fafafa;
      --color-surface: #ffffff;
      --color-panel: #f0f0f0;
      --color-title-bar: #eeeeee;
      --color-title-bar-pressed: #d8dee6;
      --color-text: #191a1c;
      --color-text-secondary: #515255;
      --color-text-muted: #777;
      --color-border: #ddd;
      --color-border-soft: #e4e5e8;
      --color-primary: #00acf7;
      --color-success-text: #468847;
      --color-success-border: #d6e9c6;
      --color-success-bg: #dff0d8;
      --color-danger: #dc2626;
      --color-overlay: rgba(0, 0, 0, .34);
      --radius-md: 6px;
      --radius-pill: .8em;
    }

    :root[data-theme="dark"] {
      --color-bg: #111418;
      --color-surface: #1d232a;
      --color-panel: #222732;
      --color-title-bar: #252d36;
      --color-title-bar-pressed: #283f4d;
      --color-text: #f2f5f8;
      --color-text-secondary: #aeb2b6;
      --color-text-muted: #aeb2b6;
      --color-border: #2a323b;
      --color-border-soft: #34404b;
      --color-success-text: #9fd7a2;
      --color-success-border: #365f3a;
      --color-success-bg: #1f3522;
      --color-overlay: rgba(0, 0, 0, .58);
    }

    * {
      box-sizing: border-box;
    }

    html {
      width: 360px;
      min-width: 360px;
      min-height: 520px;
      overflow: hidden;
      background: var(--color-bg);
    }

    body {
      display: flex;
      width: 360px;
      height: 520px;
      min-height: 520px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: system-ui, sans-serif;
      font-size: 15px;
      flex-direction: column;
    }

    .top-bar {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 52px;
      padding: 6px 12px 6px 18px;
      background: var(--color-title-bar);
      border-bottom: 1px solid var(--color-border);
    }

    .top-bar-icon {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      object-fit: contain;
    }

    .top-bar-copy {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      min-width: 0;
      margin-left: 12px;
    }

    .top-bar-title-row {
      display: flex;
      align-items: baseline;
      min-width: 0;
    }

    .top-bar-title {
      overflow: hidden;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .top-bar-version {
      margin-left: 7px;
      color: var(--color-text-secondary);
      font-size: 10px;
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
    }

    .top-bar-subtitle {
      margin-top: 3px;
      overflow: hidden;
      color: var(--color-text-secondary);
      font-size: 12px;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .theme-button,
    .language-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      margin-left: 4px;
      padding: 6px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
    }

    .theme-button:hover,
    .language-button:hover {
      background: var(--color-title-bar-pressed);
    }

    .theme-button img,
    .language-button img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    #location-list {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      min-height: 0;
      margin-top: 10px;
      overflow: hidden;
    }

    .badge-panel {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 30px;
      margin: 4px 16px;
      padding: 4px 8px;
      border: 1px solid var(--color-border-soft);
      border-radius: var(--radius-pill);
      background: #f0f0f0;
      color: var(--color-text-muted);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
      user-select: none;
    }

    .badge-panel-state-success {
      border-color: var(--color-success-border);
      background: var(--color-success-bg);
      color: var(--color-success-text);
    }

    .active-location {
      margin: 5px 10px 10px;
    }

    .active-location .menu-item-subitem::before {
      display: inline-block;
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      content: "";
    }

    .menu-item {
      min-height: 38px;
      margin: 0 0 1px;
      padding: 1px 0 1px 2px;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }

    .menu-item:hover {
      background: rgba(0, 172, 247, .08);
    }

    .menu-item.active {
      background: rgba(0, 172, 247, .12);
    }

    .menu-item-subitem {
      display: flex;
      align-items: center;
      width: 100%;
      height: 36px;
      padding: 2px 8px 2px 4px;
    }

    .toggle-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      flex: 0 0 20px;
      color: var(--color-primary);
      font-style: normal;
      font-weight: 700;
      visibility: hidden;
    }

    .menu-item:hover .toggle-button {
      visibility: visible;
    }

    .menu-item.active:hover .toggle-button {
      color: var(--color-danger);
    }

    .menu-flag {
      display: inline-block;
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      object-fit: contain;
      vertical-align: middle;
    }

    .menu-item-text,
    .active-location-text {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      padding-left: 12px;
      line-height: 1.2;
      text-align: left;
    }

    .menu-item-location,
    .active-location-name {
      display: block;
      overflow: hidden;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .menu-item-address,
    .active-location-address {
      display: block;
      overflow: hidden;
      color: #666;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .switch {
      position: relative;
      flex: 0 0 auto;
      width: 42px;
      height: 24px;
    }

    .switch input {
      width: 0;
      height: 0;
      opacity: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: #cbd5e1;
      cursor: pointer;
      transition: .2s;
    }

    .slider::before {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: white;
      content: "";
      transition: .2s;
    }

    .switch input:checked + .slider {
      background: var(--color-primary);
    }

    .switch input:checked + .slider::before {
      transform: translateX(18px);
    }

    .badge-panel-toolbar {
      justify-content: center;
      margin-bottom: 6px;
    }

    .add-location-footer {
      margin-top: auto;
      padding: 10px 16px 14px;
    }

    .add-location-button {
      width: 100%;
      height: 36px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      color: var(--color-text);
      cursor: pointer;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      font-weight: 600;
    }

    .add-location-button:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    #all-locations {
      flex: 1 1 auto;
      min-height: 0;
      max-height: 320px;
      padding: 0 10px;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .location-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 2px;
      visibility: hidden;
    }

    .menu-item:hover .location-actions {
      visibility: visible;
    }

    .location-action {
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #999;
      cursor: pointer;
      font-size: 15px;
    }

    .location-action:hover {
      color: var(--color-primary);
    }

    .location-action.delete:hover {
      color: var(--color-danger);
    }

    .empty-state {
      padding: 30px 10px;
      color: #777;
      text-align: center;
      font-size: 13px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: var(--color-overlay);
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal {
      width: 100%;
      max-height: 490px;
      overflow: hidden;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      background: white;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .22);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 38px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--color-border-soft);
    }

    .modal-title {
      font-size: 14px;
      font-weight: 700;
    }

    .modal-close {
      width: 26px;
      height: 26px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #777;
      cursor: pointer;
      font-size: 20px;
      line-height: 24px;
    }

    .map-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 32px;
      padding: 4px 7px;
      border-bottom: 1px solid var(--color-border-soft);
      color: #666;
      font-size: 12px;
      font-weight: 600;
    }

    .map-controls {
      display: flex;
      gap: 4px;
    }

    .map-control {
      width: 26px;
      height: 24px;
      padding: 0;
      border: 1px solid var(--color-border);
      border-radius: 5px;
      background: white;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
    }

    .map {
      position: relative;
      width: 100%;
      height: 290px;
      overflow: hidden;
      background: #dbeafe;
      cursor: crosshair;
      touch-action: none;
      user-select: none;
    }

    .map.dragging {
      cursor: grabbing;
    }

    .map-tiles {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .map-tile {
      position: absolute;
      width: 256px;
      height: 256px;
      pointer-events: none;
      user-select: none;
    }

    .map-marker {
      position: absolute;
      z-index: 20;
      display: none;
      width: 18px;
      height: 18px;
      border: 3px solid white;
      border-radius: 50% 50% 50% 0;
      background: var(--color-primary);
      box-shadow: 0 1px 4px rgba(0,0,0,.35);
      transform: translate(-50%, -100%) rotate(-45deg);
      pointer-events: none;
    }

    .map-marker.visible {
      display: block;
    }

    .map-attribution {
      padding: 3px 7px;
      border-top: 1px solid var(--color-border-soft);
      color: #777;
      font-size: 9px;
      text-align: right;
    }

    .map-attribution a {
      color: inherit;
    }

    .selected-place {
      min-height: 54px;
      padding: 8px 10px;
      border-top: 1px solid var(--color-border-soft);
      background: #fafafa;
    }

    .selected-place-name {
      overflow: hidden;
      font-size: 13px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .selected-place-details {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 3px;
      color: #666;
      font-size: 11px;
    }

    .selected-place-flag {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      padding: 8px 10px 10px;
      border-top: 1px solid var(--color-border-soft);
    }

    .button {
      flex: 1;
      min-height: 32px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: white;
      cursor: pointer;
      font-weight: 600;
    }

    .button.primary {
      border-color: var(--color-primary);
      background: var(--color-primary);
      color: white;
    }

    .button.danger {
      border-color: var(--color-danger);
      background: var(--color-danger);
      color: white;
    }

    .button:disabled {
      cursor: default;
      opacity: .45;
    }

    .confirm-body {
      padding: 18px 14px;
      color: #333;
      font-size: 13px;
      line-height: 1.45;
    }

    .confirm-location {
      margin-top: 8px;
      font-weight: 700;
    }

    :root[data-theme="dark"] .badge-panel {
      background: var(--color-panel);
    }

    :root[data-theme="dark"] .menu-item:hover {
      background: rgba(105, 175, 237, .12);
    }

    :root[data-theme="dark"] .menu-item.active {
      background: rgba(105, 175, 237, .18);
    }

    :root[data-theme="dark"] .menu-item-address,
    :root[data-theme="dark"] .active-location-address,
    :root[data-theme="dark"] .map-toolbar,
    :root[data-theme="dark"] .map-attribution,
    :root[data-theme="dark"] .selected-place-details,
    :root[data-theme="dark"] .modal-close,
    :root[data-theme="dark"] .empty-state {
      color: var(--color-text-secondary);
    }

    :root[data-theme="dark"] .modal,
    :root[data-theme="dark"] .map-control,
    :root[data-theme="dark"] .button {
      background: var(--color-surface);
      color: var(--color-text);
    }

    :root[data-theme="dark"] .selected-place {
      background: var(--color-panel);
    }

    :root[data-theme="dark"] .confirm-body {
      color: var(--color-text);
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <img id="top-bar-status-icon" class="top-bar-icon" src="img/disabled.png" alt="">
    <div class="top-bar-copy">
      <div class="top-bar-title-row">
        <div class="top-bar-title" data-i18n="appName">Fake GPS</div>
        <div id="top-bar-version" class="top-bar-version"></div>
      </div>
      <div id="top-bar-subtitle" class="top-bar-subtitle"></div>
    </div>
    <button id="theme-button" class="theme-button" type="button" data-i18n-title="changeTheme">
      <img id="theme-icon" src="img/theme_moon.png" alt="">
    </button>
    <button id="language-button" class="language-button" type="button" data-i18n-title="changeLanguage">
      <img id="language-flag" src="img/language_us.png" alt="">
    </button>
  </header>

  <div id="location-list">
    <div id="status-badge" class="badge-panel"></div>

    <div class="active-location">
      <span class="menu-item-subitem">
        <img id="active-location-flag" class="menu-flag" src="img/flags/unknown.png" alt="">
        <span class="active-location-text">
          <span id="active-location-name" class="active-location-name">No active location</span>
          <span id="active-location-address" class="active-location-address"></span>
        </span>
        <label class="switch" data-i18n-title="enableLocationSpoofing">
          <input type="checkbox" id="enable-toggle">
          <span class="slider"></span>
        </label>
      </span>
    </div>

    <div class="badge-panel badge-panel-toolbar">
      <span data-i18n="availableLocations">Available Locations</span>
    </div>

    <div id="all-locations"></div>

    <div class="add-location-footer">
      <button id="add-location-button" class="add-location-button" type="button" data-i18n="addLocation">Add location</button>
    </div>
  </div>

  <div id="delete-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" data-i18n="deleteLocation">Delete Location</span>
        <button id="delete-close-button" class="modal-close" type="button" data-i18n-title="close">×</button>
      </div>
      <div class="confirm-body">
        <span data-i18n="deleteQuestion">Delete this saved location?</span>
        <div id="delete-location-name" class="confirm-location"></div>
      </div>
      <div class="modal-actions">
        <button id="delete-cancel-button" class="button" type="button" data-i18n="cancel">Cancel</button>
        <button id="delete-confirm-button" class="button danger" type="button" data-i18n="delete">Delete</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
